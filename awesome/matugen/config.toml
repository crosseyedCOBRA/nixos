# matugen config run by awesome-colors (../bin/awesome-colors) on each
# wallpaper, for dwl: the bar, rofi and alacritty templates below, then the
# app ones (GTK, starship, fastfetch, btop, Vesktop, swaync, hyprlock),
# whose templates are shared with Hyprland's config (../../hyprland/matugen/)
# and deployed to ~/.config/matugen/awesome/apps/ by home/awesome.nix.

[config]

# Same fixed terminal hues as the shared config, for alacritty's palette
# (templates/alacritty-colors.toml).
[config.custom_colors]
red = { color = "#e05561", blend = true }
green = { color = "#8cc265", blend = true }
yellow = { color = "#d8a657", blend = true }
blue = { color = "#4aa5f0", blend = true }
magenta = { color = "#c162de", blend = true }
cyan = { color = "#42b3c2", blend = true }

[templates.quickshell]
input_path = "~/.config/matugen/awesome/templates/colors.json"
output_path = "~/.cache/awesome/colors.json"

[templates.rofi]
input_path = "~/.config/matugen/awesome/templates/rofi-colors.rasi"
output_path = "~/.cache/awesome/rofi-colors.rasi"

[templates.hyprlock]
input_path = "~/.config/matugen/awesome/apps/hyprlock-colors.conf"
output_path = "~/.cache/hypr/hyprlock-colors.conf"

[templates.swaync]
input_path = "~/.config/matugen/awesome/apps/colors.css"
output_path = "~/.config/hypr/colors.css"

[templates.alacritty]
input_path = "~/.config/matugen/awesome/templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors.toml"

# --- Apps ---

[templates.gtk3]
input_path = "~/.config/matugen/awesome/apps/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/awesome/apps/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.starship]
input_path = "~/.config/matugen/awesome/apps/starship.toml"
output_path = "~/.config/starship.toml"

[templates.fastfetch]
input_path = "~/.config/matugen/awesome/apps/fastfetch.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.btop]
input_path = "~/.config/matugen/awesome/apps/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.vesktop]
input_path = "~/.config/matugen/awesome/apps/vesktop.theme.css"
output_path = "~/.config/vesktop/themes/matugen.theme.css"
