# Started by hyprlock-timeout only while the screen is locked, and stopped
# again on unlock -- so the monitors time out on the lock screen and never
# while the session is unlocked. Any key or mouse movement wakes them.

general {
    # Locked means away: a paused video, a game or Discord holding an idle
    # inhibitor shouldn't keep the monitors on behind the lock screen.
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
    # Only here to blank the screens; leave suspend handling alone.
    inhibit_sleep = 0
}

listener {
    timeout = 60
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
