# 16-color ANSI palette (ls colors, git diffs, vim/shell syntax
# highlighting, etc.) -- Material You only guarantees 3 genuinely
# distinct chromatic hues (primary/secondary/tertiary) plus error, not a
# full rainbow, so red/green/yellow/blue/magenta/cyan below are a
# pragmatic mapping onto those 4 hue families (error->red, secondary
# ~green, tertiary ~yellow, primary->blue, tertiary_container~magenta,
# secondary_container~cyan) rather than colorimetrically exact ANSI
# colors -- the same approach matugen's own community terminal templates
# use, since Material's palette was never designed to produce 16
# distinct hues in the first place.
